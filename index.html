<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BeanDance</title>
<meta name="description" content="记住每包豆子该磨多少。Remember the grind for every bag.">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  @font-face { font-family: "Gluten"; src: url("fonts/Gluten-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
  :root { --bg: #F3EFE8; --bg2: #E9E2D6; --fg: #241A14; --muted: rgba(36,26,20,.55); --line: rgba(36,26,20,.14); --accent: #8C5A36; --ring: transparent; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1E1611; --bg2: #140E0B; --fg: #F3EFE8; --muted: rgba(243,239,232,.55); --line: rgba(243,239,232,.16); --accent: #C79A6C; --ring: rgba(243,239,232,.12); color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--fg);
    background: radial-gradient(120% 80% at 50% 30%, var(--bg) 40%, var(--bg2) 100%) fixed, var(--bg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(48px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom)); text-align: center;
  }
  .hero { margin: auto 0; display: flex; flex-direction: column; align-items: center; }
  .icon { width: 112px; height: 112px; border-radius: 25px; box-shadow: 0 0 0 1px var(--ring), 0 1px 2px rgba(36,26,20,.12), 0 12px 32px rgba(36,26,20,.16); }
  .mark { margin: 28px 0 0; display: inline-flex; align-items: center; gap: 5px; transform: rotate(-3deg);
          font: 700 38px/1 "Gluten", ui-rounded, "SF Pro Rounded", system-ui, sans-serif; letter-spacing: -0.6px; }
  .bean { width: 8px; height: 11px; border-radius: 50%; background: var(--accent); transform: translateY(-3px) rotate(28deg);
          box-shadow: inset 2px 0 0 -0.5px rgba(255,255,255,.25); }
  .line { margin: 22px 0 0; font-size: 17px; font-weight: 500; text-wrap: balance; }
  .line span { display: block; color: var(--muted); font-size: 15px; font-weight: 400; margin-top: 2px; }
  .soon { margin: 30px 0 0; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); }
  footer { padding-top: 40px; display: flex; gap: 20px; font-size: 13px; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--fg); }
</style>
</head>
<body>
<main>
  <div class="hero">
  <img class="icon" src="icon.png" alt="">
  <h1 class="mark" aria-label="BeanDance">beandance<i class="bean" aria-hidden="true"></i></h1>
  <p class="line">记住每包豆子该磨多少。<span>Remember the grind for every bag.</span></p>
  <p class="soon">App Store 即将上架 · Coming soon</p>
  </div>
  <footer>
    <a href="privacy.html">隐私政策 · Privacy</a>
    <a href="https://github.com/caiman001/beandance/issues">反馈 · Feedback</a>
  </footer>
</main>
</body>
</html>
